<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Poster Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <nav class="navigation">
            <a href="/" class="nav-link">Create Poster</a>
            <a href="/gallery" class="nav-link active">Gallery</a>
            <a href="/favorites" class="nav-link">Favorites</a>
        </nav>

        <h1>Movie Poster Gallery</h1>
        
        <div class="gallery-grid">
            {% for poster in posters %}
            <div class="gallery-item" data-poster-id="{{ poster.id }}">
                <div class="poster-card">
                    <img src="{{ poster.image_path }}" alt="{{ poster.title }}">
                    <div class="poster-info">
                        <h3>{{ poster.title }}</h3>
                        <p>Directed by {{ poster.director }}</p>
                        <p class="genre">{{ poster.genre.upper() }}</p>
                        <button class="favorite-btn" onclick="toggleFavorite({{ poster.id }})">
                            <i class="fas fa-heart"></i>
                        </button>
                    </div>
                    <div class="color-palette">
                        {% for color in poster.color_palette|from_json %}
                        <div class="color-swatch" style="background-color: {{ color }}"></div>
                        {% endfor %}
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script>
        async function toggleFavorite(posterId) {
            try {
                const response = await fetch('/toggle_favorite', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ poster_id: posterId })
                });
                
                const data = await response.json();
                if (data.success) {
                    const btn = document.querySelector(`[data-poster-id="${posterId}"] .favorite-btn`);
                    btn.classList.toggle('active', data.is_favorite);
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }
    </script>
</body>
</html>
